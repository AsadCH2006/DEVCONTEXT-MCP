[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devcontext-mcp"
version = "0.1.0"
description = "FastMCP server for managing development context and notes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.1.0",
]

[project.scripts]
devcontext-mcp = "devcontext_mcp.server:main"
