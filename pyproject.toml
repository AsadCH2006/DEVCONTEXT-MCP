[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartvault-mcp"
version = "0.1.0"
description = "A fast, lightweight context memo and snippet vault for Model Context Protocol (MCP)."
readme = "README.md"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
smartvault-mcp = "smartvault_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]